<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Me Contacter</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <nav style="display: flex;justify-content: space-between;">
            <div class="logo">Dev<span>FS</span></div>
            <ul>
                <li><a href="../index.html">Présentation</a></li>
                <li><a href="competences.html">Compétences</a></li>
                <li><a href="projets.html">Projets</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="contact-container">
        <h1>Me <span class="highlight">Contacter</span></h1>
        <p>Un projet en tête ? N'hésitez pas à m'envoyer un message.</p>

        <section class="contact-content">
            <h2>📧 Envoyez un message</h2>
            <form class="contact-form" action="#" method="POST">
                <div class="form-group">
                    <label for="name">Nom complet</label>
                    <input type="text" id="name" name="name" placeholder="Votre nom" required>
                </div>

                <div class="form-group">
                    <label for="email">Adresse Email</label>
                    <input type="email" id="email" name="email" placeholder="votre@email.com" required>
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" placeholder="Votre message ici..." required></textarea>
                </div>

                <button type="submit" class="btn">Envoyer le message</button>
            </form>
        </section>

        <section class="contact-content">
            <h2>💼 Demander un devis</h2>
            <form class="contact-form" action="#" method="POST">
                <div class="form-group">
                    <label for="project-type">Type de projet</label>
                    <select id="project-type" name="project-type">
                        <option value="web">Développement Site Web</option>
                        <option value="c-lang">Application en Langage C</option>
                        <option value="network">Infrastructure Réseau</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="budget">Budget estimé (FCFA)</label>
                    <input type="text" id="budget" name="budget" placeholder="Ex: 50 000 FCFA">
                </div>
                <button type="submit" class="btn">Demander l'estimation</button>
            </form>
        </section>
    </main>

    <footer>
        <div class="footer-content">
            <p>&copy; 2026 - Awa Seck | Portfolio Étudiant</p>
            <div class="footer-links">
                <a href="https://github.com/ton-username" target="_blank">GitHub</a>
                <a href="../Mon_CV_professionnel_.pdf" target="_blank" class="btn-cv">
                    📄 Télécharger mon CV (PDF)
                </a>
            </div>
            <p class="instructor">Projet pour Monsieur Diouf</p>
        </div>
    </footer>

</body>
</html>
